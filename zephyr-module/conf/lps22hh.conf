# LPS22HH pressure + temperature over the browser-backed VIRTIO I2C adapter.
#
# Bundles samples/sensor/lps22hh. No irq-gpios on the simulated bus, so force
# polling / one-shot mode (the driver's default without TRIGGER).

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LPS22HH=y
CONFIG_LPS22HH_TRIGGER_NONE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=8192
