# Stock samples/drivers/led/pwm against the browser PCA9685 at 0x60.
#
# The sample fades and blinks pwm-leds children. Address is 0x60 (not Adafruit's
# 0x40) so it can coexist with ina219@40 in the virtio-i2c catalog.

CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_PWM_PCA9685=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
