# Previously used to emit zephyr.strip for smaller HTTP payloads. Packaged
# images now ship the unstripped zephyr.elf so the in-page debugger can resolve
# CONFIG_DEBUG_THREAD_INFO symbols (same ABI as OpenOCD). Kept here only as a
# reference if a build needs a stripped artifact for something else —
# tools/build-zephyr-image.sh no longer applies this fragment.
CONFIG_BUILD_OUTPUT_STRIPPED=y
