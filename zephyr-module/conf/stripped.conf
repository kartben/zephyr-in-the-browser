# Have the build emit build/zephyr/zephyr.strip alongside zephyr.elf.
#
# The linked ELF is mostly DWARF — ~1.5 MB against ~64 KB of loadable image —
# and the packaged images are fetched over HTTP on every boot, so what ships is
# the stripped copy. Letting Zephyr produce it (with the same toolchain that
# linked it) is what frees tools/build-zephyr-image.sh from locating a strip
# binary itself, which differs between the build container and a CI runner.
#
# Applied to every packaged build by tools/build-zephyr-image.sh, not listed
# per app in the manifest.
CONFIG_BUILD_OUTPUT_STRIPPED=y
