# I2C over the browser-backed VIRTIO adapter, with the shell to poke it.
#
# Pairs with the virtio-i2c snippet (zephyr-module/snippets/virtio-i2c), which
# enables the adapter and the default chips, plus i2c-sensors-extra for the
# optional sensors the shell exposes.
#
#   i2c scan virtio_i2c0            find the chips the browser is answering for
#   i2c read virtio_i2c0 50 10 4    read 4 bytes from EEPROM word address 0x10
#   eeprom write EEPROM_0 0x10 ...  the same part through the EEPROM API
#
CONFIG_I2C=y
CONFIG_I2C_SHELL=y

# The AT24 the page models at 0x50, reached through Zephyr's stock driver —
# which is the point: a browser-simulated chip binding to an unmodified
# in-tree driver, not a bespoke one.
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_EEPROM_SHELL=y

# The TMP112 the page models at 0x48, following the Sensor panel's temperature
# slider — again through Zephyr's own driver, so `sensor get tmp112@48` reads a
# value the browser made up as if it came off a real part.
CONFIG_SENSOR=y
CONFIG_TMP112=y
# A second temperature part (lm75@49), a 3-axis accelerometer (adxl345@53), a
# 6-axis IMU (lsm6dso@6a), pressure (lps22hh@5c), power (ina219@40), and light
# (isl29035@44), all page-simulated on the same bus:
#   sensor get lm75@49
#   sensor get adxl345@53
#   sensor get lsm6dso@6a
#   sensor get lps22hh@5c
#   sensor get ina219@40
#   sensor get isl29035@44
CONFIG_LM75=y
CONFIG_ADXL345=y
CONFIG_LSM6DSO=y
CONFIG_LSM6DSO_TRIGGER_NONE=y
CONFIG_LPS22HH=y
CONFIG_LPS22HH_TRIGGER_NONE=y
CONFIG_INA219=y
CONFIG_ISL29035=y
CONFIG_ISL29035_TRIGGER_NONE=y
CONFIG_ISL29035_LUX_RANGE_4K=y
CONFIG_SENSOR_SHELL=y

# Every I2C transfer blocks on a virtqueue round trip to the browser, so the
# shell thread does the waiting and needs room for it.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL_STACK_SIZE=8192
