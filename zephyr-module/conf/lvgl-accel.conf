# The accelerometer_chart sample ships CONFIG_MAIN_STACK_SIZE=4096, a value
# tuned for the 32-bit native_sim host it targets upstream. On the 64-bit
# qemu_cortex_a53 that 4 KB is too tight: the main thread runs lv_timer_handler,
# and when the timer callback logs (its error path calls LOG_ERR, whose deferred
# cbprintf packaging is stack-hungry on aarch64) the frame chain overruns the
# stack. Zephyr's sentinel names it "Stack overflow"; without CONFIG_STACK_SENTINEL
# the overrun silently corrupts memory and surfaces as a wild instruction abort
# at PC=0 with a scrambled register file. 8 KB clears the worst case (a LOG_ERR
# on every tick) with headroom. See docs/a53-lvgl-stack.md.
CONFIG_MAIN_STACK_SIZE=8192

# The accelerometer is a simulated ADXL345 on the browser's I2C bus, in place of
# the retired qemu,host-sensor. The virtio-i2c snippet declares adxl345@53 and
# aliases accel0 to it; the stock adi,adxl345 driver reads it, and the page can
# point it at the device's own tilt. Needs the virtio-i2c snippet on the build.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADXL345=y

# Guest-side LVGL cost dominates this sample on qemu-wasm. Pair these rates with
# the forked app's circular update mode and the accel-display 480×320 ramfb:
# enough points for a readable trace, fast enough to feel live, without asking
# the emulated A53 to shift a full-screen three-series chart fifty times a
# second (the upstream defaults).
CONFIG_SAMPLE_ACCEL_SAMPLING_RATE=25
CONFIG_SAMPLE_CHART_POINTS_PER_SERIES=40
