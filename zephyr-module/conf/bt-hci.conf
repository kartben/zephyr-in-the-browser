# Host-only Bluetooth over the browser HCI UART (H:4).
# The page runs a Bumble virtual controller; there is no on-chip LL.

CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_H4=y

# Virtual controllers (Bumble, Android netsim) often reject Zephyr's default
# host→controller ACL flow-control parameters.
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n

# Enough for samples/bluetooth/peripheral and friends on A53.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Bumble's initialization replies drive crypto and identity work through the
# Bluetooth long-work queue.  Its 1400-byte default overflows on AArch64 into
# the adjacent logging stack before the peripheral begins advertising.
CONFIG_BT_LONG_WQ_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
