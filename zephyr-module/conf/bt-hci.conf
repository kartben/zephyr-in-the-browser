# Host-only Bluetooth over the browser HCI UART (H:4).
# The page runs a Bumble virtual controller; there is no on-chip LL.

CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_H4=y

# Virtual controllers (Bumble, Android netsim) often reject Zephyr's default
# host→controller ACL flow-control parameters.
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n

# Back Zephyr's Bluetooth settings with the dedicated browser-persisted W25Q
# exposed on CS1 by bt-settings-spi. The stock peripheral sample enables
# SETTINGS + NVS; without a flash page layout it falls back to SETTINGS_NONE
# and logs failures while saving the identity, IRK, and GATT database hash.
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_MINIMAL=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# SPI NOR and NVS initialization run synchronously on the sample's main thread.
# The upstream 2 KiB default overflows on AArch64 before Bluetooth can advertise.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Bumble's initialization replies drive crypto and identity work through the
# Bluetooth long-work queue.  Its 1400-byte default overflows on AArch64 into
# the adjacent logging stack before the peripheral begins advertising.
CONFIG_BT_LONG_WQ_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y

# Semaphores must stay out of the object-core inventory on Bluetooth builds.
#
# conf/debug-threads.conf turns CONFIG_OBJ_CORE on for every packaged image so
# the Debug panel's Objects tab has something to walk. Zephyr's
# bt_hci_cmd_send_sync() declares its `struct k_sem sync_sem` on the *stack* and
# k_sem_init()s it, which links a stack address into obj_type_sem's global list.
# Nothing unlinks it when the frame dies, so the list tail is left dangling into
# reclaimed stack. The next k_sem_init() — hci_init() sizing bt_dev.ncmd_sem
# from the controller's ncmd — runs `str x0, [tail]` through that stale pointer,
# lands on the caller's saved LR, and returns into data: a CPU exception in
# main during bt_enable(), before any sample can advertise or scan.
#
# Object cores have no concept of an object whose storage goes away, so the fix
# is to keep the type that does this out of them. Threads, stacks and the rest
# still participate, so the Threads tab is unaffected; the Objects tab simply
# lists no semaphores on Bluetooth builds.
CONFIG_OBJ_CORE_SEM=n
