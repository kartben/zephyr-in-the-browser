# Apply *after* conf/tracing.conf + tracing-net.conf for http_server.
#
# Evidence from FAR=0 / Illegal Execution dumps: CTF epacket pointers land just
# past service_thread_stack into the adjacent 800-byte mgmt_stack while
# net_socket_service is current. Sync semihost flushes on that poll/callback
# path; ASYNC keeps only the small epacket VLA on the emitter and moves the
# semihost write to the tracing thread (like a ring-buffer offload).
#
# Socket API CTF still off: address[46] frames are large VLAs on the emitter.
# Net-core + IPC (queue/fifo/lifo/stack) stay on for Trace Queues / Networking.
CONFIG_TRACING_ASYNC=y
CONFIG_TRACING_BUFFER_SIZE=8192
CONFIG_TRACING_THREAD_STACK_SIZE=8192
CONFIG_TRACING_NET_SOCKETS=n
# ISR enter/exit under SYNC/semihost is noisy; with ASYNC the put is cheap but
# still adds VLAs on every IRQ nesting into the net RX path.
CONFIG_TRACING_ISR=n

CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=16384
CONFIG_HTTP_SERVER_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048

# Undo tracing-net.conf's NET_IPV6=y (needed only when socket-address CTF is
# emitted). Browser net is IPv4-only; sockets CTF is off above so the TSDL
# address[46] width does not apply.
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_NEED_IPV6=n
