# samples/drivers/can/* against the ESP32-C3's own TWAI controller, with the
# browser's simulated bus behind it (net/can/can_browser.c and src/can/bus.ts).
# can_counter runs from zephyr-module/apps/can_counter, a vendored copy of the
# stock sample with two thread stacks enlarged.
#
# Shorter than conf/mcp2515.conf because there is no bridge chip: no SPI, and
# no GPIO interrupt line to wire, because TWAI has its own interrupt in the
# SoC's matrix. GPIO is still on for the LED the sample blinks on an LED frame.

CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_LOG=y

# CAN_ESP32_TWAI defaults y once the DT node is enabled, so it is not set here.
# can_counter's own prj.conf brings CAN, SHELL, CAN_SHELL and the STATS
# commands.

# Bus-off recovery is automatic unless this is set, and without it can_recover()
# is not available at all. The dock's Recover button and the shell's
# `can recover` both mean the manual path, so ask for it explicitly.
CONFIG_CAN_MANUAL_RECOVERY_MODE=y

CONFIG_MAIN_STACK_SIZE=8192
