# Stock samples/drivers/fuel_gauge against the browser MAX17048 at 0x36.
#
# The sample polls FUEL_GAUGE_RELATIVE_STATE_OF_CHARGE_PCT and
# FUEL_GAUGE_VOLTAGE_UV via alias fuel-gauge0 (see max17048-only overlay).

CONFIG_I2C=y
CONFIG_FUEL_GAUGE=y
CONFIG_MAX17048=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
