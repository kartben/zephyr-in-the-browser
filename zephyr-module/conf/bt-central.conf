# The browser Bumble controller supports the central_hr data path but does not
# implement Zephyr's optional post-connect PHY preference command. If left at
# the central-role default (2M), HCI_LE_SET_PHY never completes and Zephyr
# asserts on the command timeout before GATT discovery can start.
CONFIG_BT_AUTO_PHY_CENTRAL_NONE=y

# Keep the demo on the conservative baseline link parameters. Heart-rate
# notifications are tiny, so an automatic data-length procedure adds no value.
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
