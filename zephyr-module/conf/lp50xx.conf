# Stock samples/drivers/led/lp50xx against the browser LP5012 at 0x14.
#
# The sample cycles RGB colors via led_write_channels / led_set_color /
# led_set_brightness. DT node is ti,lp5012 (DEVICE_DT_GET_ANY); no alias needed.
# enable-gpios omitted — treat chip as already asserted (page model has no EN pin).
# CONFIG_LP50XX is selected automatically when ti,lp5012 is okay.

CONFIG_I2C=y
CONFIG_LED=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
