# ISL29035 ambient light over the browser-backed VIRTIO I2C adapter.
#
# Bundles samples/sensor/isl29035. Upstream prj.conf asks for trigger mode and
# the 4K lux range; without int-gpios force polling and keep the 4K range so
# the page-side encode matches.

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ISL29035=y
CONFIG_ISL29035_TRIGGER_NONE=y
CONFIG_ISL29035_LUX_RANGE_4K=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=8192
