# INA219 current/power monitor over the browser-backed VIRTIO I2C adapter.
#
# Bundles samples/sensor/ina219 (virtio-i2c + ina219-only). Devicetree
# properties (shunt, LSB, ADC) live on the virtio-i2c overlay node so they
# match the page-side encoding.

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_INA219=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=8192
