# samples/drivers/can/* against the browser MCP2515 on SPI CS0. can_counter
# runs from zephyr-module/apps/can_counter, a vendored copy of the stock
# sample with two thread stacks enlarged (see that copy's header for why);
# can_babbling is not yet packaged and still resolves to the stock tree.
#
# The page plays the rest of the bus (src/can/bus.ts): delivery, arbitration,
# ACK and the error counters that follow. The controller's INT line is a
# virtio-gpio input, so GPIO is not optional here — without it the driver's
# interrupt thread never wakes and nothing is ever received.

CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_LOG=y

# CAN_MCP2515 defaults y once the DT compatible is enabled, so it is not set
# here. can_counter's own prj.conf (copied verbatim into the vendored app)
# brings CAN, SHELL, CAN_SHELL, GPIO and the STATS commands, plus
# CAN_INIT_PRIORITY=80 so the controller probes after the SPI bus.

# Bus-off recovery is automatic unless this is set, and without it can_recover()
# is not available at all. The dock's Recover button and the shell's
# `can recover` both mean the manual path, so ask for it explicitly.
CONFIG_CAN_MANUAL_RECOVERY_MODE=y

# Every register touch is a virtqueue round trip, and the driver services
# receives on its own thread (default stack 1024).
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_CAN_MCP2515_INT_THREAD_STACK_SIZE=2048
