# Stock samples/drivers/eeprom against the browser AT24 at 0x50.
#
# The sample is a boot counter: it reads a magic + count from offset 0,
# increments, and writes back. The page persists the AT24's backing store in
# localStorage across reloads, so "Reset the MCU" (a page reload here) keeps
# counting — and the Memory card's erase button wipes it.

CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
