# Turn the display panel into a touch surface.
#
# Everything else is already in place upstream: the Cortex-A53 board devicetree
# declares `virtio_input0` on virtio-mmio slot 3 and points `zephyr,touch` at
# it, and CONFIG_INPUT_VIRTIO defaults on from that node. But the whole input
# subsystem is opt-in, so without this one symbol the driver is never compiled
# and the chosen goes nowhere.
#
# LVGL then builds a pointer indev from `zephyr,touch` on its own
# (LV_Z_POINTER_FROM_CHOSEN_TOUCH, default y), so a demo becomes clickable
# without a line of application code.
#
# The browser end is src/hostInput.ts, feeding the virtio-tablet-device that
# src/boards.ts puts on slot 3.
CONFIG_INPUT=y

# Zephyr's input thread runs at K_LOWEST_APPLICATION_THREAD_PRIO (14 here,
# subsys/input/input.c) unless you override it, and `main` runs at priority 0.
# That is fine for a sample that sleeps between frames. It is not fine for an
# LVGL demo: once lvgl_music starts playing, `lv_timer_handler()` takes ~60 ms
# per frame and the next refresh is already due when it returns, so main never
# yields, the priority-14 input thread never runs, and the 16-slot input queue
# fills and drops. The symptom is that the play button works exactly once and
# the UI is dead afterwards, which looked for a long time like a lost event in
# the browser bridge or the virtio tablet. It is neither: the events arrive and
# the guest never reads them.
#
# A cooperative priority is the right shape here. The thread's whole body is
# `k_msgq_get(..., K_FOREVER)` plus a callback that queues one LVGL message, so
# it drains the moment an event lands and blocks again immediately.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1
