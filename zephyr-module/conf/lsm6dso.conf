# LSM6DSO IMU over the browser-backed VIRTIO I2C adapter.
#
# Bundles Zephyr's samples/sensor/lsm6dso: the sample calls sensor_attr_set()
# to put accel and gyro at 12.5 Hz, then polls both channels. The page models
# the part at 0x6a (virtio-i2c + lsm6dso-only snippets); the stock st,lsm6dso
# driver binds to it.
#
# Upstream prj.conf asks for trigger mode (CONFIG_LSM6DSO_TRIGGER_GLOBAL_THREAD).
# That needs an irq-gpios line we do not wire on the simulated bus, so force
# polling — the sample's #else path — and keep the ODR attribute demo intact.

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO=y
CONFIG_LSM6DSO_TRIGGER_NONE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
