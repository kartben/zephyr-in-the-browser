# samples/boards/espressif/deep_sleep on the ESP32-C3.
#
# The sleep is one second rather than the sample's default five, because a
# sleep costs its own duration multiplied by how far behind real time this
# machine runs. The guest spins in rtc_sleep_start() waiting for a wake it
# cannot see, and under -icount that wait is emulated instruction by
# instruction, so five seconds of sleep is about two minutes of wall clock in
# the browser. One second is long enough to watch the power card go dark and
# short enough to see it come back. See docs/esp32.md.
CONFIG_EXAMPLE_WAKEUP_TIME_SEC=1
