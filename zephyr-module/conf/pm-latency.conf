# System-managed device power management, for samples/subsys/pm/latency.
#
# CONFIG_PM itself is not here: the sample's own Kconfig does `select HAS_PM`
# (APP_PROVIDE_PM_HOOKS) and supplies pm_state_set() / pm_state_exit_post_ops()
# in src/pm.c, which is what makes CONFIG_PM reachable on a board whose SoC does
# not select HAS_PM. The state ladder comes from the cpu-power-states snippet.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# Keep PM_DEVICE out of shared fragments. gnss_nmea_generic.c calls
# pm_device_init_suspended() under CONFIG_PM_DEVICE and implements only RESUME,
# so a device-PM build of the GNSS sample would boot with a dead receiver. This
# fragment is named for one sample on purpose.

# Immediate logging, and this one is load-bearing rather than cosmetic.
#
# The sample sleeps 1.1 / 1.2 / 1.3 s and expects to reach RUNTIME_IDLE,
# SUSPEND_TO_IDLE and STANDBY in turn. Deferred logging (the default) spawns a
# processing thread that wakes every CONFIG_LOG_PROCESS_THREAD_SLEEP_MS = 1000 ms,
# which becomes the nearest timeout and caps what the policy is offered at ~101
# ticks — just over runtime-idle's 101-tick threshold and permanently short of
# suspend-to-idle's 112. Measured: without this the guest enters RUNTIME_IDLE
# every single time and the two deeper states are unreachable, while the sample's
# own log lines keep claiming otherwise.
#
# Immediate mode has no processing thread, so the only timeouts in the system are
# the sample's own sleeps and the full ladder is reached.
CONFIG_LOG_MODE_IMMEDIATE=y
