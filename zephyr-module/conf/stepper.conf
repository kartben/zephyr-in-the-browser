# Stock samples/drivers/stepper/generic against gpio step/dir on the browser GPIO.
#
# No adi,tmc2209 (or other UART) stepper-driver — enable/disable modes are no-ops
# for the gpio-step-dir packaging. See conf/tmc50xx.conf for the SPI TMC50xx
# sample. STEP_INTERVAL_NS is a few ms so the M3 MMIO poll (1 ms when steppers
# are present) and virtio path both catch STEP edges for the dock dial.

CONFIG_GPIO=y
CONFIG_STEPPER=y
CONFIG_INPUT=y
CONFIG_LOG=y

CONFIG_STEP_INTERVAL_NS=5000000
CONFIG_MAIN_STACK_SIZE=4096
