# Stock samples/subsys/fs/littlefs against the browser W25Q on virtio-spi.
#
# Overlay (virtio-spi) declares storage_partition + fstab lfs1 → /lfs. The
# sample prefers DT_NODELABEL(lfs1) when present.

CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_MINIMAL=y
# Match W25Q 4 KiB sectors (and the page stub). Stock default is 64 KiB, which
# makes LittleFS block_size 65536 and breaks the dock browser until remount.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_APP_LITTLEFS_STORAGE_FLASH=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# fs_dirent + virtqueue round trips need room.
CONFIG_MAIN_STACK_SIZE=8192
