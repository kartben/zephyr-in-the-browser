# Stock samples/drivers/auxdisplay against the browser PT6314 on SPI CS0
# (Futaba-style 20×2 VFD — matches Zephyr's esp32c3_devkitm overlay).
#
# The sample enables the cursor and writes "Hello world from <board>".

CONFIG_SPI=y
CONFIG_AUXDISPLAY=y
CONFIG_AUXDISPLAY_PT6314=y

# Every SPI transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
