# Real traffic goes deeper than the page's simulated LAN. With the gateway
# uplink (docs/net-gateway.md) inbound connections arrive with full-fat TCP
# options from real kernels, and on the 64-bit boards that overflowed the RX
# queue thread's default 1500-byte stack the moment a host connected to
# echo_server through passt: ZEPHYR FATAL ERROR in rx_q[0], registers full of
# 0xaaaa stack fill. Same failure class as the A53 main-stack bump the other
# conf fragments carry (CONFIG_MAIN_STACK_SIZE=8192).
#
# Applied to the qemu_cortex_a53 / qemu_riscv32 net samples only — the
# Cortex-M3's 64 KiB SRAM is the tight budget there, and its sandbox use
# never showed the overflow.
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096

# The sandbox's proxy-ARP answers for any address, so the static samples never
# needed a default gateway; a real network does. 192.0.2.2 is both the sim's
# gateway and what the gateway recipe assigns passt (-g 192.0.2.2), so the
# static samples route off-subnet replies identically in both modes. DHCP
# samples ignore this and take the lease's router.
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
