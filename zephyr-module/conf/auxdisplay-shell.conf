# Auxiliary displays reachable from the stock shell sample via the vendored
# `auxdisplay` shell module (zephyr-module/drivers/vendor/auxdisplay_shell.c).
#
# Pair with -S virtio-i2c,auxdisplays (JHD1313 @0x3e) and -S virtio-spi
# (PT6314 on CS1 alongside the JEDEC NOR on CS0):
#
#   auxdisplay size jhd1313@3e
#   auxdisplay write jhd1313@3e "Hello"
#   auxdisplay backlight jhd1313@3e 5
#   auxdisplay size pt6314@1
#   auxdisplay write pt6314@1 "VFD"
#
# Drivers default y when their DT nodes are okay (DT_HAS_*_ENABLED).

CONFIG_AUXDISPLAY=y
CONFIG_AUXDISPLAY_SHELL=y
