# Stock samples/drivers/auxdisplay against the browser JHD1313 at 0x3e
# (RGB backlight register file at 0x62).
#
# The sample enables the cursor and writes "Hello world from <board>".

CONFIG_I2C=y
CONFIG_AUXDISPLAY=y
CONFIG_AUXDISPLAY_JHD1313=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
