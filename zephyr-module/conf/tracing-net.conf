# Net-object CTF for samples that already pull conf/tracing.conf + networking.
# Apply *after* conf/net.conf so NET_IPV6 can override the IPv4-sandbox default.
#
# Why NET_IPV6 here: Zephyr's CTF TSDL declares socket address fields as
# ctf_bounded_string_t address[46] (INET6_ADDRSTRLEN). The guest only emits
# that width when CONFIG_NET_IPV6=y; with IPv6 off, ctf_top.h uses 20-byte
# strings and the stream desyncs against public/tracing/metadata.
CONFIG_TRACING_NETWORKING=y
CONFIG_TRACING_NET_SOCKETS=y
CONFIG_TRACING_NET_CORE=y
CONFIG_NET_IPV6=y

# Upstream net samples size stacks for 32-bit boards (http_get: 1536,
# echo_server: 2048, net_socket_service default ~1200). On qemu_cortex_a53,
# sync CTF semihost + address[46] VLAs overflow into adjacent stacks (FAR=0 /
# Illegal Execution — same class as docs/a53-lvgl-stack.md). Bump the hot
# paths; samples that still smash should pull tracing-http-server.conf
# (ASYNC + drop socket API CTF) after this fragment.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192
