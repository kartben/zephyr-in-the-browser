# Net-object CTF for samples that already pull conf/tracing.conf + networking.
# Apply *after* conf/net.conf so NET_IPV6 can override the IPv4-sandbox default.
#
# Why NET_IPV6 here: Zephyr's CTF TSDL declares socket address fields as
# ctf_bounded_string_t address[46] (INET6_ADDRSTRLEN). The guest only emits
# that width when CONFIG_NET_IPV6=y; with IPv6 off, ctf_top.h uses 20-byte
# strings and the stream desyncs against public/tracing/metadata.
CONFIG_TRACING_NETWORKING=y
CONFIG_TRACING_NET_SOCKETS=y
CONFIG_TRACING_NET_CORE=y
CONFIG_NET_IPV6=y
