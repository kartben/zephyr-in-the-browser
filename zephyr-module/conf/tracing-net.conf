# Net-object CTF for samples that already pull conf/tracing.conf + networking.
# Prefer the `browser-tracing-net` snippet; keep in sync with
# zephyr-module/snippets/browser-tracing-net/browser-tracing-net.conf.
#
# Never enable IPv6 here. The browser LAN is IPv4-only (conf/net.conf). Guest
# CTF then emits 20-byte address strings; the in-page decoder probes 20 vs the
# TSDL's address[46] (src/ctf/netAddressWidth.ts).
CONFIG_TRACING_NETWORKING=y
CONFIG_TRACING_NET_SOCKETS=y
CONFIG_TRACING_NET_CORE=y
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_NEED_IPV6=n

# Upstream net samples size stacks for 32-bit boards (http_get: 1536,
# echo_server: 2048, net_socket_service default ~1200). On qemu_cortex_a53,
# sync CTF semihost frames overflow into adjacent stacks (FAR=0 / Illegal
# Execution — same class as docs/a53-lvgl-stack.md). Bump the hot paths; a
# sample that still smashes wants CONFIG_TRACING_ASYNC=y plus
# CONFIG_TRACING_NET_SOCKETS=n (the socket API's address[46] frames are the
# large VLAs on the emitter) in a fragment applied after this one.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192
