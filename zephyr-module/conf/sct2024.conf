# Stock samples/drivers/led/sct2024 against the browser SCT2024 on SPI CS0.
#
# LA/OE GPIOs ride virtio_gpio0 pins 6/7 (see sct2024-only overlay). The sample
# binds DEVICE_DT_GET_ANY(sct_sct2024); no alias needed.

CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_LED_SCT2024=y

# SPI + GPIO virtqueue round trips on every LED update.
CONFIG_MAIN_STACK_SIZE=8192
