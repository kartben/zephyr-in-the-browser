# Stock samples/drivers/led/lp5562 against the browser LP5562 at 0x30.
#
# The sample cycles RGBW colors via led_set_brightness, then blinks via
# engine programs. DT node is ti,lp5562 (DEVICE_DT_GET_ANY); no alias needed.
# enable-gpios omitted — treat chip as already asserted (page model has no EN pin).

CONFIG_I2C=y
CONFIG_LED=y
CONFIG_LP5562=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
