# In-page gdb Threads tab — same ABI OpenOCD uses for Zephyr RTOS awareness.
#
# Emits `_kernel_thread_info_offsets` (and aliases) so the host can walk
# `_kernel.threads` without hard-coding struct layouts. Also selects
# THREAD_MONITOR + THREAD_NAME. Applied to every packaged build.
CONFIG_DEBUG_THREAD_INFO=y

# Object cores provide the debugger with a typed, live inventory of kernel
# objects. The host walks z_obj_type_list (and uses the descriptor section for
# sizes/static ranges), so this covers dynamically initialized objects too.
# Individual object integrations default on with CONFIG_OBJ_CORE.
CONFIG_OBJ_CORE=y

# Ship the same statistics contract in every packaged image. Participating
# types default on: thread/CPU/kernel cycle usage, memory slabs, and sys memory
# blocks when those subsystems are present. This costs some RAM and scheduler
# accounting work, which is appropriate for these teaching/debug builds.
CONFIG_OBJ_CORE_STATS=y

# In-page gdb Stack tab. With frame pointers the host follows an exact
# {caller fp, return address} chain; without them it falls back to scanning the
# stack for plausible callers, which is a guess the panel has to label as one.
# Costs a register and a little code size — worth it for a playground.
CONFIG_FRAME_POINTER=y
