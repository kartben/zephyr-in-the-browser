# In-page gdb Threads tab — same ABI OpenOCD uses for Zephyr RTOS awareness.
#
# Emits `_kernel_thread_info_offsets` (and aliases) so the host can walk
# `_kernel.threads` without hard-coding struct layouts. Also selects
# THREAD_MONITOR + THREAD_NAME. Applied to every packaged build.
CONFIG_DEBUG_THREAD_INFO=y

# In-page gdb Stack tab. With frame pointers the host follows an exact
# {caller fp, return address} chain; without them it falls back to scanning the
# stack for plausible callers, which is a guess the panel has to label as one.
# Costs a register and a little code size — worth it for a playground.
CONFIG_FRAME_POINTER=y
