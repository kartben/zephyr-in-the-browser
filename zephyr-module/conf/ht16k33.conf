# Stock samples/drivers/ht16k33 against the browser HT16K33 at 0x70.
#
# The sample walks all 128 LEDs, blinks at 2/1/0.5 Hz, then dims. Keyscan is
# deliberately off — the page models display RAM / setup / dimming only.

CONFIG_I2C=y
CONFIG_LED=y
CONFIG_HT16K33_KEYSCAN=n

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
