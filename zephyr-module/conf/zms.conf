# Stock samples/subsys/kvss/zms on the storage-spi NOR. The sample mounts
# 3 sectors of storage_partition, rewrites its keys over 300 remounts, fills
# the store, deletes everything and ends with zms_clear(), so the flash card's
# ZMS view is worth opening while it runs.

# The sample keeps its iterator arrays on main's stack; the 4 KB A53 default
# has overflowed in LOG paths before (lvgl-accel.conf).
CONFIG_MAIN_STACK_SIZE=8192
