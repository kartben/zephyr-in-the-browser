# CTF + ARM semihosting — same path as samples/subsys/tracing/basic.
# Guest writes ./tracing.bin; the Trace panel polls it via Emscripten FS.
# See docs/tracing-feasibility.md.
CONFIG_THREAD_NAME=y
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BUFFER_SIZE=4096
CONFIG_TRACING_BACKEND_SEMIHOST=y
CONFIG_TRACING_SYNC=y
CONFIG_SEMIHOST=y

# Explicit (Zephyr also defaults these y under NETWORKING, but pin them so
# traced net samples cannot silently drop socket/net_* CTF). Harmless when
# networking is off — see conf/tracing-net.conf for NET_IPV6 + net samples.
CONFIG_TRACING_NETWORKING=y
CONFIG_TRACING_NET_SOCKETS=y
CONFIG_TRACING_NET_CORE=y
