# FAT filesystem on the VIRTIO block disk (virtio-blk snippet).
#
# The disk is a stock QEMU virtio-blk device over a raw image the page
# allocates blank in the Emscripten filesystem, so there is nothing to format
# it beforehand — the guest does it on the first mount.
#
# Pair with -S virtio-blk, which enables virtio_blk0 and the fatfs0 fstab entry.

CONFIG_DISK_DRIVER_VIRTIO_BLK=y

CONFIG_FILE_SYSTEM=y
# Selects DISK_ACCESS, which in turn selects DISK_DRIVERS.
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=y

# Upstream's PR teaches modules/fatfs/zephyr_fatfs_config.h to add virtio,blk
# disk names to FF_VOLUME_STRS. That file is in the Zephyr tree and an
# out-of-tree module cannot patch it, so declare the one volume by hand
# instead: fatfs_init() splits this string into the same VolumeStr[] array
# zfs_diskio.c indexes for the name it passes to disk_access_*. Must match
# disk-name on the virtio_blk0 node. Delete both lines when the PR merges —
# see zephyr-module/drivers/vendor/VENDOR.md.
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="VIRTIOBLK0"

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# fs_dirent plus a virtqueue round trip per sector needs room.
CONFIG_MAIN_STACK_SIZE=8192
