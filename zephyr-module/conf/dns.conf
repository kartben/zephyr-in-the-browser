# The resolver address for name-resolving samples. 192.0.2.3 is where BOTH
# networks answer DNS: the in-page sandbox replies to any :53 destination
# (and advertises .3 in its DHCP lease), and the gateway's passt intercepts
# exactly this address (--dns-forward 192.0.2.3 --dns 192.0.2.3, the PR #244
# defaults). The stock sample default of 192.0.2.2 collides with the gateway
# address, which passt NATs to the *host's loopback* — so through the gateway
# every static-mode getaddrinfo went to 127.0.0.1:53 in the container, where
# nothing listens, and resolution timed out while the sandbox (answering
# anywhere) kept masking the mismatch.
#
# Only samples that enable the DNS resolver can carry this fragment:
# DNS_SERVER1 depends on DNS_SERVER_IP_ADDRESSES, and Zephyr hard-errors on
# assigning symbols with unmet dependencies (keep it off echo_server/zperf).
CONFIG_DNS_SERVER1="192.0.2.3"
