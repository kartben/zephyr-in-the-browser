# Stock samples/drivers/rtc against the browser PCF8523 at 0x68.
#
# The sample sets a fixed time then prints rtc_get_time once a second. The
# page's RTC card shows the same clock (and alarms when the shell sample
# programs them).

CONFIG_I2C=y
CONFIG_RTC=y
CONFIG_RTC_PCF8523=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
