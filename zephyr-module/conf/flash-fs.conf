# Flash + LittleFS on the browser SPI NOR (virtio-spi snippet).
#
# Shell affordances:
#   flash read w25q80jv@0 0 16
#   flash erase w25q80jv@0 0 4096
#   fs mount littlefs /lfs
#   fs ls /lfs
#   fs read /lfs/boot_count
#
# Pair with -S virtio-spi so the W25Q + storage_partition + fstab lfs1 exist.

CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SHELL=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_MINIMAL=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL_STACK_SIZE=8192
