# The http_get sample ships CONFIG_MAIN_STACK_SIZE=1536, tuned for the 32-bit
# targets it usually runs on — small enough that it *undercuts* the 4096 the
# arm64 arch Kconfig would otherwise default to (the dhcp/zperf images get that
# default and boot fine). On the 64-bit qemu_cortex_a53 the main thread
# overflows during net init + the DNS query TX, and the spill lands in the
# adjacent z_idle_stacks — right where the idle thread's saved exception frame
# lives — so the eret after the next interrupt restores a scrambled context:
# SPSR.IL + PC=0, surfacing as "FATAL ERROR 0: CPU exception ... (idle)" with
# net-stack values in the register dump. CONFIG_STACK_SENTINEL names the real
# culprit (K_ERR_STACK_CHK_FAIL at the main-stack base) and 8 KB boots the full
# DNS + HTTP path clean with headroom, matching the accelerometer_chart
# precedent in conf/lvgl-accel.conf / docs/a53-lvgl-stack.md and the rx_q bump
# in conf/net-uplink.conf.
CONFIG_MAIN_STACK_SIZE=8192
