# Apply *after* conf/tracing.conf for net-heavy samples.
#
# Sync semihost CTF flushes on the emitting thread. Under the HTTP server that
# is often net_socket_service / RX paths; the call depth + dual fifo/queue CTF
# smashes the service stack (LR lands in __bss_start). Async buffers in a ring
# and a dedicated tracing thread does the semihost write.
CONFIG_TRACING_ASYNC=y
CONFIG_TRACING_BUFFER_SIZE=8192
CONFIG_TRACING_THREAD_STACK_SIZE=4096

# Socket enter/exit frames carry INET6 address[46] strings; packing those on
# net_socket_service (poll loop) still blows the stack even with async put.
# Keep net-core + IPC (fifo/queue/…) for the Queues tab; drop socket API CTF.
CONFIG_TRACING_NET_SOCKETS=n
