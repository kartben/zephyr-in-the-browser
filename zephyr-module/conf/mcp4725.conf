# Stock samples/drivers/dac against the browser MCP4725 at 0x61.
#
# The sample writes a sawtooth via dac_write_value. Address is 0x61 (not the
# breakout default 0x60) so it can coexist with pca9685@60 in the virtio-i2c
# catalog.

CONFIG_I2C=y
CONFIG_DAC=y
CONFIG_DAC_MCP4725=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192
