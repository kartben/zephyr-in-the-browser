# Stock samples/drivers/dac against the browser MCP4725 at 0x61.
#
# The sample writes a sawtooth via dac_write_value. Address is 0x61 (not the
# breakout default 0x60) so it can coexist with pca9685@60 in the virtio-i2c
# catalog.

CONFIG_I2C=y
CONFIG_DAC=y
CONFIG_DAC_MCP4725=y

# Every I2C transfer blocks on a virtqueue round trip to the browser.
CONFIG_MAIN_STACK_SIZE=8192

# The sample sleeps k_sleep(K_MSEC(1)) between writes, expecting ~1000 Hz.
# Zephyr's kernel/Kconfig forces SYS_CLOCK_TICKS_PER_SEC=100 (10 ms ticks) on
# every QEMU_TARGET board ahead of the 10000 Hz default TICKLESS_KERNEL would
# otherwise pick -- so even with tickless on, a 1 ms request gets ceil()'d up
# to a full 10 ms tick. Measured: rebuilding just this guest image (no QEMU
# rebuild) with the tick rate raised took the sawtooth from ~48 Hz to ~415 Hz,
# landing on the ~1 ms virtio-i2c round trip as the real limit instead.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
