# Stock samples/drivers/led/led_strip against the browser WS2812 on SPI CS0.
#
# The sample binds DEVICE_DT_GET(DT_ALIAS(led_strip)); the ws2812-only overlay
# provides that alias. WS2812_STRIP_SPI defaults on when the DT compatible is
# present — keep SPI + stack headroom for the virtqueue RTT and the ~384-byte
# TX buffer (16 pixels × 24 SPI bytes).
#
# Speed note: spi-max-frequency in the overlay does not pace aemu — each
# led_strip_update_rgb is one virtqueue round trip (~ms), which dominates.
# The SPI traffic spy is fine at ~10 Hz; leave it closed if you want less UI
# work. Baudrate / WS2812 pulse timing is decoded logically, not wall-clock.

CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# One strip update is a bulk SPI write through virtio; give main some room.
CONFIG_MAIN_STACK_SIZE=8192

# Stock default is 16 — fine on silicon, nearly invisible in the dock orbs.
CONFIG_SAMPLE_LED_BRIGHTNESS=96

# Stock default 50 ms. Keep it; the chase already pays one virtio RTT per step.
CONFIG_SAMPLE_LED_UPDATE_DELAY=50
