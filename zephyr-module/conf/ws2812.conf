# Browser WS2812 on SPI CS0 — used by zephyr-module/apps/led_strip (deadline
# paced chase) behind -S ws2812-only.
#
# spi-max-frequency in the overlay does not pace aemu. Each update is one
# virtqueue round trip (~ms). Baudrate / WS2812 pulse timing are decoded
# logically, not wall-clock.
#
# QEMU boards force SYS_CLOCK_TICKS_PER_SEC=100 (10 ms ticks). The driver's
# reset-delay k_usleep(8) then ceil's to a full tick and adds ~10 ms on top of
# the sample period — same trap as conf/mcp4725.conf. Raise the tick rate and
# zero the overlay reset-delay so the 50 ms deadline is actually ~50 ms wall.

CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

CONFIG_SAMPLE_LED_BRIGHTNESS=96
CONFIG_SAMPLE_LED_UPDATE_DELAY=50
