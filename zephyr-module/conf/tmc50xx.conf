# Stock samples/drivers/stepper/tmc50xx against the browser TMC50xx on SPI CS0.
#
# The sample binds DEVICE_DT_GET(DT_ALIAS(stepper_ctrl)) / stepper_driver; the
# tmc50xx-only overlay provides those aliases. STEPPER_ADI_TMC50XX* defaults on
# when the DT compatibles are present — keep SPI + a little stack headroom for
# the virtqueue RTT and the rampstat poll work.

CONFIG_SPI=y
CONFIG_STEPPER=y
CONFIG_LOG=y

# One SPI datagram is a short virtqueue round-trip; give main some room.
CONFIG_MAIN_STACK_SIZE=8192

# Shorter ping-pong so the dock dial finishes a rev before the next move on
# slow wasm guests (default is 1 rev × 200 × 256 µsteps).
CONFIG_PING_PONG_N_REV=1
