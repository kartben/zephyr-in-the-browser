# Stock samples/drivers/stepper/tmcm3216 against uart1 RS485/TMCL.
#
# The page simulates the TMCM-3216: guest TX is captured on the browser-gnss
# UART, echoed for RS485 loopback, and answered with TMCL replies. DE is a
# real GPIO (virtio/host) so the stock driver can toggle it.

CONFIG_STEPPER=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_GPIO=y

# Gentler ramp so the dock dial is readable under qemu-wasm timing.
CONFIG_MAX_VELOCITY=8000
CONFIG_MAX_ACCELERATION=2000
CONFIG_MAX_DECELERATION=2000
CONFIG_PING_PONG_N_REV=1

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
