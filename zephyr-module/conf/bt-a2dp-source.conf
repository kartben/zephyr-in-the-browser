# Classic A2DP source extras on top of conf/bt-hci.conf.
# Stock sample: samples/bluetooth/classic/a2dp_source (prj.conf enables
# CONFIG_BT_CLASSIC / AVDTP / A2DP_SOURCE). See
# https://docs.zephyrproject.org/latest/samples/bluetooth/classic/a2dp_source/README.html

# Media PDUs need room beyond the LE defaults. Mirror the a2dp_sink sample's
# ACL RX sizing and give L2CAP TX enough headroom for SBC frames (~1 KiB app
# pool in the sample Kconfig). TX ACL size follows CONFIG_BT_L2CAP_TX_MTU.
CONFIG_BT_BUF_ACL_RX_SIZE=1300
CONFIG_BT_L2CAP_TX_MTU=1000
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_CONN_TX_MAX=10

# SBC encode + AVDTP send on the sample's audio work queue. The sample default
# (1024) overflows on AArch64 once the sine/SBC path runs; keep it well above
# the bt-hci MAIN/LONG_WQ floors.
CONFIG_BT_A2DP_SOURCE_DATA_SEND_WORKQ_STACK_SIZE=4096
CONFIG_BT_A2DP_SOURCE_DATA_BUF_SIZE=1000
CONFIG_BT_A2DP_SOURCE_DATA_BUF_COUNT=5

# Inquiry → page → SDP → AVDTP needs a bit more host heap than BLE demos.
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Optional: longer page timeout (slots of 0.625 ms). Default is fine for
# LocalLink; keep explicit so browser demos do not time out while Pyodide
# answers the first classic HCI commands.
CONFIG_BT_PAGE_TIMEOUT=0x4000
