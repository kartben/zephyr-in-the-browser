# Kite Rush on the A53, flown with the mouse: ramfb is the display and the
# virtio-input tablet is `zephyr,touch`, so a drag steers and a click starts a
# game or does a barrel roll. No CRSF receiver is declared, so the radio path
# and its telemetry compile out and the game cruises at a steady airspeed.

# The game paces frames on absolute k_sleep() deadlines of 1000 / 60 ms.
# QEMU_TARGET boards get 100 Hz ticks (see mcp4725.conf), which would round
# every frame up to 20 ms; the sample's own qemu_x86 board file raises it too.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# The upstream sample's 4 KB main stack is sized for 32-bit boards. The A53 has
# overflowed 4 KB main stacks in LOG_ERR paths before (lvgl-accel.conf).
CONFIG_MAIN_STACK_SIZE=8192

# ramfb keeps no memory of its own to diff against, but bigger strips still
# mean fewer display_write() calls per frame. Same value as the sample's
# qemu_x86 board file.
CONFIG_KITE_RUSH_STRIP_BUFFER_SIZE=65536
