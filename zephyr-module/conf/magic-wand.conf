# zephyr-module/apps/magic_wand on the browser's qemu_cortex_a53.
#
# Upstream sizes main() at 4 KB for 32-bit MCUs. On the 64-bit A53 every frame
# is wider, TFLM's interpreter and kernels nest deeply, and the traced twin
# runs synchronous CTF over semihosting from inside them. 16 KB leaves room,
# and the sentinel turns an overflow into a named fault instead of corrupted
# memory (docs/a53-lvgl-stack.md tells that story for LVGL).
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_STACK_SENTINEL=y

# The accelerometer is the simulated ADXL345 on the browser's I2C bus: the
# virtio-i2c snippet declares adxl345@53 and adxl345-only enables it. The
# stock adi,adxl345 driver reads it, and the page replays recorded gestures
# into it or follows the device's own tilt.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADXL345=y

# The traced twin, without syscall events. Zephyr's CTF declares its syscall
# hooks (subsys/tracing/ctf/tracing_ctf_syscall.h) without extern "C", so a C++
# call to a traced syscall, sensor_sample_fetch() here, links against mangled
# names that do not exist. The Trace panel draws no syscall events anyway.
CONFIG_TRACING_SYSCALL=n
