description: |
  VIRTIO SPI controller device (ID:45).

  This node must be a child of a VIRTIO transport node, for example:

    &virtio_mmio0 {
            status = "okay";

            virtio_spi: virtio-spi {
                    compatible = "virtio,spi";
                    status = "okay";
                    #address-cells = <1>;
                    #size-cells = <0>;
            };
    };

  The chip select of a device on the bus is given by the "reg" property of its
  node, and is passed to the VIRTIO device, which drives the corresponding chip
  select line. The number of usable chip selects is reported by the device.

compatible: "virtio,spi"

include: [spi-controller.yaml]
