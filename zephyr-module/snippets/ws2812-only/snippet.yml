name: ws2812-only
description: >
  Worldsemi WS2812 addressable LED strip alone on the browser SPI bus: enable
  virtio-spi with the part on CS0 (no JEDEC NOR) and focus the dock on the RGB
  strip for samples/drivers/led/led_strip.

boards:
  qemu_cortex_a53/qemu_cortex_a53:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_cortex_a53/qemu_cortex_a53/smp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_riscv32/qemu_virt_riscv32:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
