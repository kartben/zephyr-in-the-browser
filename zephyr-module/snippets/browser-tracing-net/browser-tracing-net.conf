# Net-object CTF for samples that already pull networking + browser-tracing.
# Apply *after* conf/net.conf (and after the sample's prj.conf) so IPv6 stays
# off even when echo_server / zperf select NEED_IPV6.
#
# Never enable IPv6 here. The browser LAN is IPv4-only (conf/net.conf). Guest
# CTF then emits 20-byte address strings; the in-page decoder probes 20 vs the
# TSDL's address[46] (src/ctf/netAddressWidth.ts).
CONFIG_TRACING_NETWORKING=y
CONFIG_TRACING_NET_SOCKETS=y
CONFIG_TRACING_NET_CORE=y
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_NEED_IPV6=n
