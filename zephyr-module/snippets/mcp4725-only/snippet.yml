name: mcp4725-only
description: >
  MCP4725 DAC alone on the browser I²C bus: enable the part at 0x61 plus
  /zephyr,user dac props for samples/drivers/dac, and disable the default
  temperature / accel / EEPROM / OLED / LCD / HT16K33 / PCA9685 parts so the
  dock stays focused on the Vout chart.

boards:
  qemu_cortex_a53/qemu_cortex_a53:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_cortex_a53/qemu_cortex_a53/smp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_riscv32/qemu_virt_riscv32:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
