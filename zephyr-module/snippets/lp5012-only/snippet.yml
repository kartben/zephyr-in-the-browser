name: lp5012-only
description: >
  LP5012 RGB LED alone on the browser I²C bus: enable the part at 0x14 for
  samples/drivers/led/lp50xx, and disable the default temperature / accel /
  EEPROM / OLED / LCD / HT16K33 / LP5562 / PWM / DAC / fuel-gauge parts so the
  dock stays focused on the RGB LED card.

boards:
  qemu_cortex_a53/qemu_cortex_a53:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_cortex_a53/qemu_cortex_a53/smp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_riscv32/qemu_virt_riscv32:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
