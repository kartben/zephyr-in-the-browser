# CTF over UART for a real board + the probe bridge (docs/probe-bridge.md).
# Not for qemu — use browser-tracing (semihost) there.
#
# You still need a board overlay that sets zephyr,tracing-uart to a UART that
# is not the console.
CONFIG_THREAD_NAME=y
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BUFFER_SIZE=4096
CONFIG_TRACING_BACKEND_UART=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_HANDLE_HOST_CMD=y
