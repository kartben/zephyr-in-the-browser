name: accel-display
description: >
  Shrink the Cortex-A53 ramfb for the accelerometer chart. LVGL software-
  renders every refresh; 480×320 is still a readable 3:2 panel but cuts the
  pixel count by 36% versus the shield's 600×400 default.
append:
  EXTRA_DTC_OVERLAY_FILE: boards/${BOARD}.overlay
