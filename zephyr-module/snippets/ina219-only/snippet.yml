name: ina219-only
description: >
  INA219 alone on the browser I²C bus: enable the power monitor and disable the
  default temperature / accel parts so the dock stays focused on this sample.

boards:
  qemu_cortex_a53/qemu_cortex_a53:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_cortex_a53/qemu_cortex_a53/smp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_riscv32/qemu_virt_riscv32:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
