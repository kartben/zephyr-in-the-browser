name: esp32-i2c
description: >
  Turn the ESP32-C3's own I2C controller on and describe the chips the browser
  has on it. The C3 counterpart of virtio-i2c: same parts, same node labels,
  same `<part>-only` snippets on top. The bus underneath is the SoC's, driven
  by Zephyr's stock i2c_esp32 driver.

# ESP32-C3 only. See host-audio/snippet.yml for why the qualified spelling is
# written out rather than the bare board name, which matches nothing.
boards:
  esp32c3_devkitc/esp32c3:
    append:
      EXTRA_DTC_OVERLAY_FILE: bridge.overlay
