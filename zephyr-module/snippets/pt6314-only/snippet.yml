name: pt6314-only
description: >
  PTC PT6314 character VFD alone on the browser SPI bus: enable virtio-spi
  with the part on CS0 (no JEDEC NOR) for samples/drivers/auxdisplay. Nodename
  auxdisplay_0 is required — the stock sample binds DT_NODELABEL(auxdisplay_0).

boards:
  qemu_cortex_a53/qemu_cortex_a53:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_cortex_a53/qemu_cortex_a53/smp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_riscv32/qemu_virt_riscv32:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
