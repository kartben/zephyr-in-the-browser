name: pca9685-only
description: >
  PCA9685 PWM controller alone on the browser I²C bus: enable the part at 0x60
  plus pwm-leds children, and disable the default temperature / accel / EEPROM /
  OLED / LCD / HT16K33 parts so the dock stays focused on samples/drivers/led/pwm.

boards:
  qemu_cortex_a53/qemu_cortex_a53:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_cortex_a53/qemu_cortex_a53/smp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_riscv32/qemu_virt_riscv32:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
