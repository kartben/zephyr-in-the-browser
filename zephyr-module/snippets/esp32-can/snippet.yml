name: esp32-can
description: >
  Turn on the ESP32-C3's own TWAI controller, the SoC's CAN peripheral, with
  the browser's simulated bus on the other end of it. The C3 counterpart of
  mcp2515-only, except that nothing stands in for the controller here: TWAI is
  real hardware, modelled in QEMU on top of its SJA1000 core, and Zephyr binds
  its stock espressif,esp32-twai driver to it.

# ESP32-C3 only. See host-audio/snippet.yml for why the qualified spelling is
# written out rather than the bare board name, which matches nothing.
boards:
  esp32c3_devkitc/esp32c3:
    append:
      EXTRA_DTC_OVERLAY_FILE: bridge.overlay
