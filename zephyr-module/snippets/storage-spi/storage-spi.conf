# The NOR behind storage_partition, on the virtio-spi bus. What goes on it is
# the sample's business: samples/subsys/kvss/zms enables ZMS itself, and Kite
# Rush's Kconfig defaults ZMS and SETTINGS to y once storage_partition exists.
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_MINIMAL=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
