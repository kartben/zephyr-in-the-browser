# The NOR behind storage_partition, on the virtio-spi bus. Settings sit on ZMS,
# which the sample turns on itself (Kite Rush's Kconfig defaults FLASH,
# FLASH_MAP, ZMS and SETTINGS to y when storage_partition is enabled).
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_MINIMAL=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_ZMS=y
CONFIG_SETTINGS=y
