name: pcf8523-only
description: >
  PCF8523 RTC alone on the browser I²C bus: enable the clock chip and disable
  the default temperature / accel / EEPROM / OLED parts so the dock stays
  focused on samples/drivers/rtc (and shell rtc commands).

boards:
  qemu_cortex_a53/qemu_cortex_a53:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_cortex_a53/qemu_cortex_a53/smp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_riscv32/qemu_riscv32:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
