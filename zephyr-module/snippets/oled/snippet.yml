name: oled
description: Make the browser's SSD1306 the guest display, instead of ramfb.

# Keys are matched against "${BOARD}/${BOARD_QUALIFIERS}", so the bare board
# name matches nothing at all — and does so silently, leaving zephyr,display
# pointed at ramfb. Both qualified spellings are listed for the same reason.
boards:
  qemu_cortex_a53/qemu_cortex_a53:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_cortex_a53/qemu_cortex_a53/smp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  qemu_riscv32/qemu_virt_riscv32:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/qemu_cortex_a53.overlay
  # Its own file: the C3 has no ramfb0 to disable, so the shared overlay's last
  # stanza would be a dangling label reference.
  esp32c3_devkitc/esp32c3:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/esp32c3_devkitc.overlay
