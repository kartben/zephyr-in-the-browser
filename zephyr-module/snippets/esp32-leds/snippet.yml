name: esp32-leds
description: >
  Turn on the gpio-leds node the browser_bridge shield declares on the ESP32-C3
  DevKitC (led0 on GPIO8), so blinky has an led0 alias to drive. The board
  devicetree has no LED of its own; its button (sw0 on GPIO9) is already there
  and needs no snippet.

  Unlike host-gpio on the Cortex-M3, this enables only the LED node: the GPIO
  controller itself is the SoC's, always present, and driven by the stock
  Zephyr esp32 driver.

# ESP32-C3 only. See host-audio/snippet.yml for why the qualified spelling is
# written out rather than the bare board name, which matches nothing.
boards:
  esp32c3_devkitc/esp32c3:
    append:
      EXTRA_DTC_OVERLAY_FILE: bridge.overlay
