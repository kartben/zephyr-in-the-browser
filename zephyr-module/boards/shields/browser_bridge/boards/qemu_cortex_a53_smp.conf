#
# The CPU count has to match the `-smp` the page puts on the QEMU argv
# (src/boards.ts) and the cpu@N nodes in the overlay beside this file. Zephyr
# starts every CPU the devicetree declares up to this number and waits for it,
# so a mismatch is a hang rather than a warning. It lives here, with the rest
# of what makes this board target itself, instead of in a per-sample fragment
# that a new sample could forget.
CONFIG_MP_MAX_NUM_CPUS=4
