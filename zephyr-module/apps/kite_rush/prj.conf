CONFIG_INPUT=y
# Stick values are stored by the callback right away, no input thread needed
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_DISPLAY=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# The renderer's per-pixel loops are worth optimizing for speed
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
