CONFIG_POLL=y
CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80

# Renamed from the generic CAN_MAX_FILTER the stock prj.conf carries; current
# Zephyr scopes it per driver.
CONFIG_CAN_MCP2515_MAX_FILTERS=5

CONFIG_SHELL=y
CONFIG_CAN_SHELL=y
CONFIG_DEVICE_SHELL=y

CONFIG_GPIO=y
CONFIG_STATS=y
CONFIG_STATS_NAMES=y
CONFIG_STATS_SHELL=y
CONFIG_CAN_STATS=y
