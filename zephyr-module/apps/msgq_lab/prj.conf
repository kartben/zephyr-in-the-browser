# The `msgq` shell command drives the lab.
CONFIG_SHELL=y

# Log lines go out through the shell, which keeps the prompt you are typing at
# intact around them.
CONFIG_LOG=y

# SW0 raises an alarm from its interrupt handler.
CONFIG_GPIO=y

# Threads are named `sensor` and `consumer` in the shell, in the thread list
# and on tour cards.
CONFIG_THREAD_NAME=y

# Configuring SW0 is a round trip to the GPIO device for each call.
CONFIG_MAIN_STACK_SIZE=4096
