name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emulator_release:
        description: >-
          Release tag holding qemu-wasm-emulator.tar.gz. Overrides the
          EMULATOR_RELEASE repository variable for this run. Leave empty to use
          that variable, or deploy mock-only if it is unset too.
        required: false
        default: ''
      images_release:
        description: >-
          Release tag holding zephyr-images.tar.gz. Overrides the IMAGES_RELEASE
          repository variable for this run. Leave empty to use that variable,
          which itself falls back to the emulator tag.
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to build and deploy (tag, branch, or SHA). Defaults to the
          caller ref.
        type: string
        required: false
        default: ''
      emulator_release:
        description: >-
          Release tag holding qemu-wasm-emulator.tar.gz. Overrides the
          EMULATOR_RELEASE repository variable for this run.
        type: string
        required: false
        default: ''
      images_release:
        description: >-
          Release tag holding zephyr-images.tar.gz. Overrides the IMAGES_RELEASE
          repository variable for this run.
        type: string
        required: false
        default: ''

# Which release each half of the payload comes from. A push has no inputs, so it
# falls back to the repository variables — set EMULATOR_RELEASE once (Settings →
# Secrets and variables → Actions → Variables) and every push ships the real
# emulator. Unset, pushes deploy the mock backend alone, which still builds and
# runs.
#
# The emulator and the guest images are pinned separately so a Zephyr-only
# change can ship by moving IMAGES_RELEASE alone, with no QEMU rebuild. When
# IMAGES_RELEASE is unset the images come from the emulator's tag, which is the
# pre-split behaviour.
env:
  EMULATOR_TAG: ${{ inputs.emulator_release || vars.EMULATOR_RELEASE }}
  IMAGES_TAG: ${{ inputs.images_release || vars.IMAGES_RELEASE || inputs.emulator_release || vars.EMULATOR_RELEASE }}

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one supersede an older.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The emulator is not in git: it is a large GPLv2 binary rebuilt from
      # tools/build-qemu-wasm.sh, so it travels as a release asset instead.
      # Without it the build still succeeds and ships the mock backend, which
      # needs no cross-origin isolation.
      # Release assets are flat, so each artifact set travels as a tarball
      # rooted at qemu/ (see tools/package-emulator.sh) to preserve the zephyr/
      # subdirectory.
      - name: Fetch emulator and guest images
        if: env.EMULATOR_TAG != '' || env.IMAGES_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          has_asset() {
            gh release view "$1" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qx "$2"
          }

          fetch() {
            echo "--- $2 from $1 ---"
            gh release download "$1" --pattern "$2" --dir /tmp --clobber
            tar xzf "/tmp/$2" -C public
          }

          if [ -n "$EMULATOR_TAG" ]; then
            if has_asset "$EMULATOR_TAG" qemu-wasm-emulator.tar.gz; then
              fetch "$EMULATOR_TAG" qemu-wasm-emulator.tar.gz
            else
              echo "::error::release '$EMULATOR_TAG' has no qemu-wasm-emulator.tar.gz"
              exit 1
            fi
          fi

          if [ -n "$IMAGES_TAG" ]; then
            if has_asset "$IMAGES_TAG" zephyr-images.tar.gz; then
              fetch "$IMAGES_TAG" zephyr-images.tar.gz
            else
              echo "::error::release '$IMAGES_TAG' has no zephyr-images.tar.gz"
              exit 1
            fi
          fi

          echo "--- public/qemu ---"
          find public/qemu -type f -printf '%10s  %p\n'

      # Mirrored sample docs are not committed (see .gitignore); regenerate
      # them here so the deployed site still serves /docs/.
      - name: Fetch sample docs
        run: npm run docs:fetch

      # The Bumble wheel is pinned but intentionally not committed. Fetch it
      # into public/ before Vite copies static assets into the Pages bundle.
      - name: Fetch Bumble runtime
        run: ./tools/vendor-bumble.sh

      - name: Build
        env:
          # GitHub Pages project sites are served from /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Fail loudly rather than silently shipping a demo that cannot start.
      # The mock-only case is legitimate; a half-populated public/qemu/ is not.
      # Each half is checked only when it was actually asked for, so an
      # images-only or emulator-only deploy is not held to the other's bar.
      - name: Verify deployable output
        run: |
          test -f dist/coi-serviceworker.js \
            || { echo "::error::coi-serviceworker.js missing — the deploy would not be cross-origin isolated"; exit 1; }
          test -n "$(find dist/vendor/bumble -name 'bumble-*.whl' -print -quit 2>/dev/null)" \
            || { echo "::error::Bumble wheel missing — Bluetooth controller cannot start"; exit 1; }
          if [ -n "$EMULATOR_TAG" ]; then
            test -f dist/qemu/qemu-system-arm.js \
              && test -f dist/qemu/qemu-system-aarch64.js \
              && test -f dist/qemu/qemu-system-riscv32.js \
              || { echo "::error::emulator release did not contain a JS loader for every board in src/boards.ts"; exit 1; }
            ls dist/qemu/*.wasm >/dev/null 2>&1 \
              || { echo "::error::emulator release did not contain a .wasm"; exit 1; }
          fi
          if [ -n "$IMAGES_TAG" ]; then
            # Images live at zephyr/<board>/<app>.elf, so this has to recurse.
            [ -n "$(find dist/qemu/zephyr -name '*.elf' -print -quit 2>/dev/null)" ] \
              || { echo "::error::images release did not contain a guest image"; exit 1; }
            test -f dist/qemu/zephyr/qemu_cortex_m3/gnss.elf \
              && test -f dist/qemu/zephyr/qemu_cortex_a53/gnss.elf \
              && test -f dist/qemu/zephyr/qemu_riscv32/gnss.elf \
              || { echo "::error::images release did not contain a GNSS image for every board in src/boards.ts"; exit 1; }
            # tools/build-zephyr-image.sh ships each image's zephyr.dts beside it;
            # without them the dock and devicetree viewer lose the real tree.
            [ -n "$(find dist/qemu/zephyr -name '*.dts' -print -quit 2>/dev/null)" ] \
              || { echo "::error::images release contains no zephyr.dts files"; exit 1; }
          fi
          du -sh dist

      # The checks above prove the files are *there*. They cannot prove the
      # emulator runs, and a dead one looks identical on disk: the emsdk 4.0.10
      # spike linked with no warnings, passed typecheck and the whole vitest
      # suite, and showed nothing at all in the browser, because newer
      # Emscripten stopped assigning the HEAP* views onto Module and every
      # bridge that reads guest memory degrades to a silent no-op. Only running
      # it can see that, so run it: one board per qemu-system-* artifact,
      # checked for guest output and for the page still reaching guest memory.
      #
      # Both halves are needed. The emulator alone has nothing to boot, and
      # images alone are boot-tested by whatever emulator is already deployed.
      - name: Install Chromium for the boot smoke test
        if: env.EMULATOR_TAG != '' && env.IMAGES_TAG != ''
        run: npx playwright install --with-deps chromium

      - name: Boot smoke test
        if: env.EMULATOR_TAG != '' && env.IMAGES_TAG != ''
        # The script bounds every case itself; this is only so a wedged runner
        # cannot sit on the deploy for the job's six-hour default.
        timeout-minutes: 30
        run: node tools/smoke-boot.mjs

      # A boot that fails only on the runner is the hard kind to chase, so keep
      # what the page looked like when it gave up.
      - name: Upload boot smoke failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-failures
          path: smoke-out/
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
