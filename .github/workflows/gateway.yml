name: Publish gateway image

# The uplink gateway (gateway/) ships as a container so "give the guest a real
# network" is one docker run, with no clone and no Node install. It publishes
# to GHCR under this repository — pushing with the workflow's GITHUB_TOKEN
# auto-links the package to the repo and inherits its visibility.
#
# Triggers on main pushes that touch gateway/, not on tags: this repo's vN
# releases mean something else entirely (emulator/image tarballs for
# pages.yml), and paths filters don't compose with tag pushes anyway.
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Publishes must land in order; a queued run supersedes nothing.
concurrency:
  group: gateway-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Don't push an image the tests haven't blessed. ci.yml runs these on
      # every branch too; this is the last line of defense for direct pushes.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test the proxy
        working-directory: gateway
        run: |
          npm ci
          npm test

      # arm64 exists for Apple-silicon and Pi self-hosters; the Dockerfile's
      # `cloudflared --version && passt --version` line runs under QEMU there,
      # so a broken arm64 binary fails the build, not a user's first run.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gateway
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
