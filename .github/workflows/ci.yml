name: CI

# The page is where most of this project's logic now lives — the network stack
# and the virtio device models are TypeScript with a vitest suite — so run it on
# every branch and pull request. pages.yml only fires on main, and only reaches
# `tsc --noEmit` indirectly through `npm run build`, which is too late to be
# useful feedback.
on:
  push:
  pull_request:
  workflow_call:

# A new push supersedes an in-flight run on the same ref; nothing here deploys,
# so there is no reason to finish the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Pushing to a branch of this repo already triggers the push event, so skip
    # the duplicate run for same-repo pull requests. Fork PRs have no push event
    # here, and still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  tours:
    # Resolve every tour anchor against the guest images the site deploys
    # (IMAGES_RELEASE), so a pattern that stopped matching upstream fails the
    # pull request instead of a learner's lesson. Pull requests only, and only
    # when they touch the tours or the code that runs them. GitHub passes no
    # repository variables to a pull request from a fork, so there the job
    # skips, and pages.yml runs the same check after the merge.
    if: github.event_name == 'pull_request' && vars.IMAGES_RELEASE != ''
    runs-on: ubuntu-latest
    steps:
      # Two deep: the merge commit GitHub made, and the base it was made on.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Look for tour changes
        id: changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(tours|src/tours)/'; then
            echo "tours=true" >>"$GITHUB_OUTPUT"
          else
            echo "Nothing under tours/ or src/tours/ changed, so there is nothing to check."
          fi

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.tours == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.changes.outputs.tours == 'true'
        run: npm ci

      - name: Fetch the deployed guest images
        if: steps.changes.outputs.tours == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGES_TAG: ${{ vars.IMAGES_RELEASE }}
        run: |
          set -euo pipefail
          gh release download "$IMAGES_TAG" --pattern zephyr-images.tar.gz --dir "$RUNNER_TEMP" --clobber
          # Unpacked as pages.yml does, without the ._ twins of old assets.
          tar xzf "$RUNNER_TEMP/zephyr-images.tar.gz" -C public --exclude='._*'

      - name: Check the tours against them
        if: steps.changes.outputs.tours == 'true'
        run: npm run tour:check

  bridge:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: bridge/go.sum

      - name: Test the uber bridge
        working-directory: bridge
        run: go test ./...
