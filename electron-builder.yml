appId: io.github.kartben.zephyr-in-the-browser
productName: Zephyr in the Browser
executableName: zephyr-in-the-browser
directories:
  output: release
files:
  - dist
  - dist-electron
  - package.json
  - "!node_modules"
asar: true
npmRebuild: false
linux:
  target:
    - AppImage
    - deb
  category: Development
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
win:
  target:
    - nsis
    - zip
