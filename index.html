<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Zephyr in the Browser</title>
    <meta
      name="description"
      content="Run Zephyr in your browser: boards, samples, device dock, terminal, Trace, and Debug. No hardware required."
    />

    <!-- Link previews. Crawlers need absolute URLs, so these name the deployed site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zephyr in the Browser" />
    <meta property="og:title" content="Zephyr in the Browser" />
    <meta
      property="og:description"
      content="Boot real Zephyr builds in a tab and poke at simulated sensors, LEDs, displays and buses. Trace and debug it all live. No hardware required."
    />
    <meta property="og:url" content="https://kartben.github.io/zephyr-in-the-browser/" />
    <meta property="og:image" content="https://kartben.github.io/zephyr-in-the-browser/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Zephyr in the Browser: a terminal booting Zephyr, beside Trace and LED matrix panels"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static hosts like GitHub Pages cannot send Cross-Origin-Opener-Policy or
      Cross-Origin-Embedder-Policy, and without them SharedArrayBuffer is
      unavailable and the qemu backend refuses to start. This service worker
      re-serves the page to itself with those headers attached, reloading once
      on first visit. Harmless where the headers already arrive from the server
      (the dev server, or a host with a _headers file) — it detects isolation
      and does nothing.
    -->
    <script src="./coi-serviceworker.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
